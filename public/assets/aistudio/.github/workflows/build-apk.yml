name: Compiler APK Android

on:
  workflow_dispatch: # Permet de lancer la compilation manuellement d'un clic

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Donner les droits d'exécution à Gradle
        run: chmod +x gradlew

      - name: Compiler l'APK
        run: ./gradlew assembleRelease

      - name: Télécharger l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: mon-application-apk
          path: app/build/outputs/apk/release/*.apk
